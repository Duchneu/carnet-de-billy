.parchment{position:fixed;inset:0;z-index:-2;pointer-events:none;transform:translateZ(0);background-color:var(--paper);
  background-image:linear-gradient(var(--bg-shade),var(--bg-shade)),var(--bg-img);background-repeat:no-repeat;
  background-size:100% 100%,cover;background-position:center,center}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;color:var(--ink);background-color:var(--paper);
  font-family:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.4;font-variant-numeric:tabular-nums;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dodge);outline-offset:2px}
p{margin:0 0 8px}
p:last-child{margin-bottom:0}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:3px double var(--rule);box-shadow:0 2px 8px rgba(70,40,10,.12)}
.top-in{max-width:560px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;min-height:52px}
.top-title{flex:1;min-width:0}
.top h1{margin:0;font-family:"Grenze Gotisch",Georgia,serif;font-weight:800;font-size:26px;line-height:1}
.top .sub{font-size:14px;color:var(--ink-2);line-height:1.1}
.top-books{flex:none;width:44px;height:44px;margin-left:-6px;border:0;background:none;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.top-books svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.top-gear{flex:none;width:44px;height:44px;margin-right:-6px;border:0;background:none;cursor:pointer;color:#E6D2A6;display:flex;align-items:center;justify-content:center;padding:0}
.top-gear svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.top-stats{display:flex;gap:12px;font-size:15px;color:var(--ink-2);background:none;border:0;padding:6px 0;cursor:pointer}
.top-stats b{color:var(--ink);font-size:17px}
.top-stats .ts-pv b{color:var(--c-pv)}
.top-stats .ts-ch b{color:var(--c-cha)}

/* Page */
main{position:relative;max-width:560px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px))}
main.creating{padding-bottom:24px}
.sheet{position:relative;background:var(--sheet-a);background-image:linear-gradient(160deg,rgba(255,250,232,.35),rgba(255,250,232,0) 60%);background-size:100% 100%;border:1px solid var(--rule);border-radius:10px;padding:14px;margin:0 0 12px;box-shadow:inset 0 0 0 1px rgba(255,248,225,.35),0 2px 6px rgba(70,40,10,.14)}
.sheet h2{font-family:"Grenze Gotisch",Georgia,serif;font-weight:600;font-size:23px;line-height:1.1;margin:0 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.center{text-align:center}

/* Contrôles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--sunk);color:var(--ink);font-weight:600;cursor:pointer;touch-action:manipulation;text-align:center;line-height:1.15}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--pumpkin);border-color:var(--pumpkin);color:var(--on-pumpkin)}
.btn.danger{color:var(--blood)}
.btn.big{min-height:58px;font-size:21px;width:100%;border-radius:10px}
.btn.wide{width:100%}
input,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.8}
input[aria-invalid="true"]{border-color:var(--blood)}
.go{display:grid;grid-template-columns:1fr auto;gap:8px}
.fl{display:grid;gap:4px;font-size:14px;color:var(--ink-2);margin-bottom:10px}
.fl input,.fl textarea{color:var(--ink);font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn-row .btn{flex:1 1 140px}

/* Paragraphe */
.para{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.para-num{background:none;border:0;padding:0;cursor:text;font-family:"Grenze Gotisch",Georgia,serif;font-weight:800;font-size:84px;line-height:.85;color:var(--pumpkin);letter-spacing:-.01em}
.para-num small{font-size:.42em;color:var(--ink-2);margin-right:.12em;font-weight:600}

/* Jauges */
.vital+.vital{margin-top:16px}
.vital-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vital-head .lbl{font-weight:600;display:flex;align-items:center;gap:7px}
.vital-head .lbl .ico{width:22px;height:22px;color:var(--c)}
.ico{width:1.1em;height:1.1em;flex:none;vertical-align:-.16em;fill:currentColor}
.ico .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico .hole{fill:var(--sheet)}
.valbtn{background:none;border:0;padding:2px 0;cursor:pointer;font-size:30px;font-weight:700;line-height:1.1}
.valbtn small{font-size:17px;color:var(--ink-2);font-weight:500}
.bar{--c:var(--c-pv);height:12px;border-radius:6px;background:var(--sunk);border:1px solid var(--rule);border-color:color-mix(in srgb,var(--c) 45%,var(--rule));overflow:hidden;margin:4px 0 8px}
.bar.cha{--c:var(--c-cha)}
.bar{position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;height:100%;background:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000) 100%);box-shadow:inset 0 -1px 0 rgba(0,0,0,.15);transition:width .25s}
.bar .ghost{background:rgba(255,255,255,.92);box-shadow:none;transition:width .9s cubic-bezier(.3,0,.2,1)}
.bar.hit{animation:barhit .45s ease-out}
@keyframes barhit{0%{transform:translateX(0)}15%{transform:translateX(-4px)}35%{transform:translateX(4px)}55%{transform:translateX(-2px)}75%{transform:translateX(2px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.bar.hit{animation:none}.bar .ghost{transition:none}}
.bar.low{box-shadow:0 0 0 3px color-mix(in srgb,var(--c-pv) 30%,transparent)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps .btn{padding:0 4px}

/* Caractéristiques */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--rule);gap:1px}
.stat{background:var(--sheet);border:0;border-top:3px solid var(--c,var(--rule));padding:8px 2px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:70px}
.stat .v{font-size:27px;font-weight:700;line-height:1}
.stat .ico{width:22px;height:22px;color:var(--c)}
.stat .l{font-size:13px;color:var(--ink-2);line-height:1.1}
.stat .aj{font-size:12px;color:var(--pumpkin);line-height:1}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.counter{display:grid;grid-template-columns:46px 1fr 46px;align-items:stretch;text-align:center;border:1px solid var(--rule);border-radius:8px;background:var(--sunk);overflow:hidden}
.counter button{border:0;background:none;font-size:24px;cursor:pointer;min-height:54px}
.counter .c-mid{display:flex;flex-direction:column;justify-content:center;font-size:inherit}
.c-v{font-size:24px;font-weight:700;line-height:1;color:var(--c,var(--ink));display:inline-flex;align-items:center;gap:5px;justify-content:center}
.c-v .ico{width:20px;height:20px}
.counter{border-color:color-mix(in srgb,var(--c,var(--rule)) 40%,var(--rule))}
.c-l{font-size:13px;color:var(--ink-2)}

/* Objets */
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:13px;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);border-color:color-mix(in srgb,var(--c,var(--rule)) 40%,var(--rule));background:var(--sunk);white-space:nowrap;color:var(--c,var(--ink));display:inline-flex;align-items:center;gap:3px}
.badge .ico{width:13px;height:13px}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{text-align:left;padding:10px;border-radius:8px;border:1px solid var(--rule);background:var(--sunk);cursor:pointer;min-height:76px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pick .n{font-weight:700;font-size:18px}
.pick[aria-pressed="true"]{border-color:var(--pumpkin);box-shadow:inset 0 0 0 2px var(--pumpkin);background:var(--sheet)}
.pick[disabled]{opacity:.38;cursor:default}
.pick .hands{font-size:13px;color:var(--ink-2)}
.steps.five{grid-template-columns:repeat(5,1fr)}
.btn[aria-pressed="true"]{border-color:var(--moss);color:var(--moss)}
.summary{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.12);z-index:3}
.sum-cls{font-family:"Grenze Gotisch",Georgia,serif;font-size:26px;font-weight:800;line-height:1}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 12px;text-align:center}
.mini div{background:var(--sunk);border-radius:6px;padding:4px 0}
.mini b{display:block;font-size:20px;line-height:1.1;color:var(--c,var(--ink))}
.mini div{border-top:2px solid var(--c,transparent)}
.mini span{font-size:12px;color:var(--ink-2)}
.items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.item{width:100%;text-align:left;display:grid;gap:4px;padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--sunk);cursor:pointer}
.item .n{font-weight:700;font-size:18px}
.item .note{font-size:14px;color:var(--ink-2)}
.start-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.start-row:last-child{border-bottom:0}

/* Dés */
.die-wrap{display:inline-block;line-height:0}
.die{width:var(--s,84px);height:var(--s,84px)}
.die rect{fill:var(--die);stroke:var(--die-edge);stroke-width:2.5}
.die circle{fill:var(--pip)}
.die.blank rect{fill:none;stroke-dasharray:6 6}
.tumble{animation:tumble .42s cubic-bezier(.2,.7,.3,1)}
@keyframes tumble{0%{transform:rotate(-190deg) scale(.55)}65%{transform:rotate(14deg) scale(1.07)}100%{transform:rotate(0) scale(1)}}
/* Dé en 3D pendant le lancer */
.cube-scene{position:relative;display:inline-block;width:var(--s,84px);height:var(--s,84px)}
.hop{position:absolute;inset:0;perspective:520px}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(calc(var(--s,84px) * -.45))}
.cube .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cube .face svg{display:block;width:100%;height:100%}
.f1{transform:translateZ(calc(var(--s,84px) * .45))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s,84px) * .45))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--s,84px) * .45))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--s,84px) * .45))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--s,84px) * .45))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--s,84px) * .45))}
.die-shadow{position:absolute;left:14%;right:14%;bottom:-12px;height:12px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(3px)}
.reveal{transition:opacity .28s ease}
#app.rolling .reveal,#top.rolling .reveal{opacity:0}
#app.rolling .preview .hit{background:var(--sheet);box-shadow:none}
#app.rolling [data-a]{pointer-events:none}
.tray{display:flex;justify-content:center;align-items:center;gap:22px;min-height:130px;padding:6px 0}
.tray .die-wrap{--s:96px}
.verdict{text-align:center;font-family:"Grenze Gotisch",Georgia,serif;font-size:38px;font-weight:800;line-height:1.1;min-height:42px}
.ok{color:var(--moss)}
.ko{color:var(--blood)}
.roll-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roll-btns .btn{min-height:64px;flex-direction:column;gap:0}
.roll-btns .btn small{font-weight:500;font-size:13px;opacity:.85}
.roll-btns .btn .t{display:inline-flex;align-items:center;gap:6px}
.roll-btns .btn .ico{color:var(--c);width:20px;height:20px}
.roll-btns .btn[style]{border-color:color-mix(in srgb,var(--c) 45%,var(--rule))}
.dlg-title .ico{color:var(--c);width:24px;height:24px;margin-right:6px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:15px}
.log li:last-child{border-bottom:0}
.log time{color:var(--ink-2);white-space:nowrap}

/* Combat */
.fighter{display:grid;gap:4px}
.fighter+.fighter{margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule)}
.fighter-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fighter-name{font-family:"Grenze Gotisch",Georgia,serif;font-size:24px;font-weight:600;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sunk);border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer;min-height:34px}
.chip b{font-size:17px;margin-left:3px}
.chip.mod{border-color:var(--pumpkin)}
.qs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-top:8px}
.qs{display:grid;grid-template-columns:40px 1fr 40px;align-items:stretch;border:1px solid var(--rule);border-radius:8px;background:var(--sunk);overflow:hidden;min-height:46px}
.qs.mod{border-color:var(--pumpkin);box-shadow:inset 0 0 0 1px var(--pumpkin)}
.qs-b{border:0;background:none;font-size:21px;cursor:pointer;color:var(--ink)}
.qs-v{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:2px 0;color:var(--ink)}
.qs-v span{font-size:12px;color:var(--c,var(--ink-2));display:inline-flex;align-items:center;gap:3px}
.qs-v span .ico{width:13px;height:13px}
.qs{border-color:color-mix(in srgb,var(--c,var(--rule)) 35%,var(--rule))}
.qs-v b{font-size:19px}
.pvctl{display:flex;align-items:center;gap:4px}
.pvctl .qs-b{width:40px;height:40px;border:1px solid var(--rule);border-radius:8px;background:var(--sunk)}
.half-btn{margin-top:8px}
.turn-row{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.turnno{font-family:"Grenze Gotisch",Georgia,serif;font-size:32px;font-weight:800;line-height:1}
.note-fl textarea{min-height:46px}
.note-fl textarea:not(:placeholder-shown){border-color:var(--pumpkin);box-shadow:inset 3px 0 0 var(--pumpkin)}
.sit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sit-name{font-weight:700;font-size:21px}
.preview-wrap{overflow-x:auto;margin-top:8px}
.preview{display:grid;grid-template-columns:auto repeat(6,minmax(38px,1fr));border:1px solid var(--rule);border-radius:8px;overflow:hidden;font-size:16px;text-align:center;background:var(--rule);gap:1px;min-width:300px}
.preview>div{background:var(--sheet);padding:6px 2px}
.preview .rh{text-align:left;padding:6px 8px;color:var(--ink-2);font-size:13px;display:flex;align-items:center}
.preview .fh{font-weight:700}
.preview .dealt{color:var(--moss);font-weight:700}
.preview .taken{color:var(--blood);font-weight:700}
.preview .hit{background:var(--sunk);box-shadow:inset 0 -3px 0 var(--pumpkin)}
.dodge-line{margin-top:10px;font-size:15px;color:var(--ink-2)}
.dodge-line b{color:var(--dodge)}
.ctray{display:flex;justify-content:center;gap:28px;padding:4px 0 8px}
.ctray figure{margin:0;text-align:center}
.ctray figcaption{font-size:13px;color:var(--ink-2);margin-top:4px}
.ctray .die-wrap{--s:72px}
.last{text-align:center;font-size:17px;min-height:24px}
.banner{border-radius:10px;padding:12px;font-weight:700;text-align:center;margin:0 0 12px;font-size:19px;border:1px solid}
.banner.win{color:var(--moss);border-color:var(--moss);background:var(--sheet)}
.banner.lose{color:var(--blood);border-color:var(--blood);background:var(--sheet)}
.banner.flee{color:var(--gold);border-color:var(--gold);background:var(--sheet)}
.err{color:var(--blood);font-size:15px;min-height:20px;margin:4px 0}
details.rules summary{cursor:pointer;font-family:"Grenze Gotisch",Georgia,serif;font-size:21px;font-weight:600;min-height:32px}
details.rules ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;font-size:15px}

/* Carnet */
.hist{display:flex;flex-wrap:wrap;gap:6px}
.saves{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.saves li{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sunk)}
.saves .lbl{font-weight:600;line-height:1.2}
.saves .lbl span{display:block;font-weight:400;font-size:13px;color:var(--ink-2)}
.save-name{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.saves .lbl .sv-n{display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px;color:var(--ink)}
.sv-n .pen{width:14px;height:14px;flex:none;fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.saves .btn{min-height:40px;padding:0 10px;font-size:15px}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:3px double var(--rule);box-shadow:0 -2px 8px rgba(70,40,10,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs[hidden]{display:none}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:58px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pumpkin);font-weight:700}

/* Fenêtres */
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:0;width:min(92vw,420px);max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(8,12,16,.55)}
.dlg-in{padding:16px}
.dlg-title{font-family:"Grenze Gotisch",Georgia,serif;font-size:26px;font-weight:600;margin:0 0 8px;line-height:1.1}
.bk{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--sunk)}
.bk-title{font-family:"Grenze Gotisch",Georgia,serif;font-size:20px;font-weight:600;margin:0 0 4px}
.badges.ro{margin-top:6px;gap:6px}
.badges.ro .badge{font-size:15px;padding:3px 9px}
.badge.mod{box-shadow:inset 0 0 0 1px var(--pumpkin);border-color:var(--pumpkin)}
.pvro{cursor:default}
.arena .fighter-billy{position:relative;padding-bottom:20px}
.gear{position:absolute;right:-6px;bottom:-12px;width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gear.on{color:var(--on-pumpkin);background:var(--pumpkin)}
.dom-note{font-weight:600;text-align:center;margin:0 0 8px;color:var(--pumpkin)}
.arena{padding-bottom:10px}
.arena .fighter+.fighter{margin-top:8px;padding-top:8px}
.arena .fighter-name{font-size:21px}
.arena .valbtn{font-size:26px}
.arena-mid{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule)}
.sit-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sit-line .sit-name{font-size:19px}
.turn-chip{margin-left:auto;font-family:"Grenze Gotisch",Georgia,serif;font-size:20px;font-weight:800;color:var(--pumpkin)}
.arena .ctray{padding:6px 0 2px;gap:34px}
.arena .ctray .die-wrap{--s:60px}
.arena .last{font-size:16px;min-height:22px;margin:4px 0 0}
.last-n{font-weight:700;margin-right:2px}
.n-dealt{color:var(--c-end);font-weight:700}
.n-taken{color:var(--c-pv);font-weight:700}
.crit-txt{color:var(--c-crit)}
.rule-mini{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--pumpkin);background:var(--sunk);border-radius:6px;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.small-name{font-size:18px!important}
main.has-actionbar{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.actionbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -4px 12px rgba(70,40,10,.14)}
.actionbar-in{max-width:560px;margin:0 auto;padding:8px 12px;display:flex;gap:8px;align-items:stretch}
.act-main{flex:1;min-height:56px;font-size:20px;border-radius:10px}
.act-main .emb{width:24px;height:24px;color:currentColor}
.act-side{flex:none;min-width:58px;min-height:56px;flex-direction:column;gap:0;padding:0 8px;font-size:20px;line-height:1}
.act-side small{font-size:11px;font-weight:600;margin-top:2px}
.act-side .ico{width:20px;height:20px;color:var(--c-cha)}
.tab.live{position:relative}
.tab.live::after{content:"";position:absolute;top:8px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--c-pv);box-shadow:0 0 0 2px var(--sheet)}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{color:var(--c-pv);transform:scale(1.25)}100%{transform:scale(1)}}
@media (max-height:640px){.arena .ctray .die-wrap{--s:50px}.arena .fighter-name{font-size:19px}.arena .valbtn{font-size:22px}}
.death{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:rgba(20,12,4,0);transition:background 1.2s ease}
.death[hidden]{display:none}
.death.show{background:rgba(20,12,4,.5)}
.death-ink{position:absolute;left:50%;top:46%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:46% 54% 51% 49%/52% 47% 53% 48%;background:radial-gradient(circle at 50% 50%,#140c05 0 36%,rgba(20,12,5,.94) 50%,rgba(20,12,5,0) 70%);transform:scale(0)}
.death-ink::before,.death-ink::after{content:"";position:absolute;border-radius:50%;background:#140c05}
.death-ink::before{width:6%;height:6%;left:20%;top:30%;box-shadow:42vmax 8vmax 0 -1vmax #140c05,8vmax 44vmax 0 -2vmax #140c05}
.death-ink::after{width:4%;height:4%;right:22%;bottom:26%}
.death.show .death-ink{animation:inkspread 1.7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes inkspread{0%{transform:scale(0) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
.death-in{position:relative;text-align:center;width:100%;max-width:400px;opacity:0}
.death.show .death-in{animation:deathin 1s ease .95s forwards}

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}

  const all=catItems().filter(e=>!/install/.test(itemKey(e.n)));
  const exact=all.find(e=>itemKey(e.n)===k);if(exact)return {exact,list:[exact]};
  const tol=k.length>=8?2:1;
  const scored=all.map(e=>{const key=itemKey(e.n);let s=99;
    if(key.startsWith(k))s=0;else if(k.length>=4&&key.includes(k))s=1;
    else if(lev(key,k)<=tol)s=2;else if(k.length>=5&&lev(key.slice(0,k.length),k)<=1)s=3;
    return {e,s};}).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||a.e.n.localeCompare(b.e.n));

function d6(){
  if(window.__testDice&&window.__testDice.length)return window.__testDice.shift();
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1);let x;

}

function classOf(ids,T=prof()){
  const c={arme:0,equipement:0,outil:0};
  ids.forEach(id=>{const it=T.byId[id];if(it)c[it.cat]++;});
  if(c.arme>=2)return 'guerrier';

}

/* Deux mains : armes et objets tenus à la main. Le joueur choisit ce qu'il tient ; par défaut, les armes d'abord.
   Un objet sans main libre ne compte pas, sauf ses bonus « keep » (la Dague garde son Critique). */
function handsInfo(items,cumul,T,held,get){
  get=get||(id=>T.byId[id]);
  const inactive=new Set();let used=0;
  const n=it=>it.cat==='arme'?(it.hands||1):(it.hands||0);
  const handItems=items.filter(id=>get(id)&&n(get(id))>0);
  let order=handItems.filter(id=>get(id).cat==='arme').concat(handItems.filter(id=>get(id).cat!=='arme'));
  if(Array.isArray(held)&&held.length){const hh=held.filter(id=>handItems.includes(id));order=hh.concat(order.filter(id=>!hh.includes(id)));}
  for(const id of order){const k=n(get(id));if(!cumul&&used+k>2)inactive.add(id);else used+=k;}
  return {inactive,used,handItems,need:handItems.reduce((a,id)=>a+n(get(id)),0)};
}

  if(T.id==='cdsi'&&extra.counters){
    const d=int(extra.counters.respect)-int(extra.counters.rancune);
    const pb=d>=4?['cha',2]:d>=2?['end',2]:d<=-4?['hab',2]:d<=-2?['crit',2]:null;
    if(pb){part.bonus[pb[0]]+=pb[1];bonusNotes.push(d>0?'Respect':'Rancune');}
  }
  let endOff=0;
  for(const id of items){
    const it=itemOf(id);if(!it)continue;const off=hi.inactive.has(id);
    if(off&&it.mods.end&&!(it.keep||[]).includes('end'))endOff+=it.mods.end;
    for(const k in it.mods){if(off&&!(it.keep||[]).includes(k))continue;part.depart[k]+=it.mods[k];}
  }
  for(const it of inv||[]){const m=it.mods||{};for(const k of ITEM_KEYS)part.sac[k]+=int(m[k]);}
  const raw={};for(const k of KEYS)raw[k]=part.base[k]+part.classe[k]+part.depart[k]+part.sac[k]+part.ajust[k]+int(part.bonus[k]);
  const t=Object.assign({},raw);
  t.adr=Math.min(5,raw.adr);t.cha=Math.max(0,raw.cha);t.end=Math.max(0,raw.end);
  const pvBonus=part.depart.pvmax+part.sac.pvmax+part.ajust.pvmax+int(part.bonus.pvmax);
  /* Tome 3 : ranger un objet qui donne de l'Endurance ne diminue pas les PV max. */
  t.pvmax=Math.max(1,(t.end+(T.endKeepsPv?endOff:0))*3+pvBonus);
  return {t,raw,part,cls,pvBonus,inactive:hi.inactive,hands:hi,bonusNotes};
}

/* Une arme à deux mains exclut toute autre arme. */
function conflicts(id,picked,T=prof()){

  const others=picked.filter(p=>p!==id&&T.byId[p]&&T.byId[p].cat==='arme');

}

function normalize(){
  if(!S||!S.billy)return;
  const b=S.billy;
  const {t}=stats();
  b.pv=clamp(int(b.pv),0,t.pvmax);
  b.chance=clamp(int(b.chance),0,t.cha);
  b.counters=b.counters||{};
  for(const c of prof().counters)b.counters[c.k]=Math.max(0,int(b.counters[c.k]));
  const c=S.combat;
  if(c&&c.status!=='evite'&&c.status!=='domination'){
    c.enemy.pv=Math.max(0,int(c.enemy.pv));
    if(c.forced)c.status=c.forced;
    else if(b.pv<=0)c.status=c.noDeath?'fin':'defaite';
    else if(c.enemy.pv<=0||(c.winAt!=null&&c.enemy.pv<=c.winAt))c.status='victoire';

    if(c.status==='victoire'){if(!c.winLine)c.winLine=pickLine(WIN_LINES);}else if(c.status==='en cours')delete c.winLine;
  }
}

/* ---------- Combat ---------- */
/* État d'un combat restauré par « Annuler l'assaut » : valeurs, réglages et effets déjà déclenchés. */
const STATE_KEYS=['survivals','eDodge','eBonusFace','enemy','mods','habDiv','habMin','billyFirst','noDom','noCrit','noReduce','forceDiff','fixedTaken','halfTaken','dealtCap','dealtWin','oddHalfDealt','oddNoTaken','eDoubleBelow','quiet','noReplyTurn','noChance','noReroll','winAt','limit','forced','ticks','perLoss','lossDone','below','belowDone','rollHab','noDeath','free','instantWin'];
function combatSnap(c){const o={};for(const k of STATE_KEYS)if(c[k]!==undefined)o[k]=clone(c[k]);return o;}
function combatRestore(c,o){for(const k of STATE_KEYS)delete c[k];Object.assign(c,clone(o));}
const noRerollNow=(c,n)=>c.noReroll===true||(typeof c.noReroll==='number'&&n<=c.noReroll);
const noChanceNow=(c,n)=>c.noChance===true||(typeof c.noChance==='number'&&n<=c.noChance);
function effB(){
  const st=stats();const c=S.combat;const m=c.mods;
  /* Habileté ÷ 2 : appliquée à l'Habileté de la fiche, avant les bonus du combat, minimum 1. */
  let hab=st.t.hab;
  if(c.habDiv==='up')hab=Math.max(1,Math.ceil(hab/2));
  else if(c.habDiv==='down')hab=Math.max(1,Math.floor(hab/2));
  hab+=int(m.hab);
  if(c.habMin!=null)hab=Math.max(hab,c.habMin);
  return {hab,adr:Math.min(5,st.t.adr+int(m.adr)),arm:st.t.arm+int(m.arm),deg:st.t.deg+int(m.deg),crit:st.t.crit+int(m.crit),cls:st.cls};
}
function situation(){
  const c=S.combat;const b=effB();const e=c.enemy;
  const diff=b.hab-int(e.hab);const forced=c.forceDiff!=null;
  const cd=forced?clamp(int(c.forceDiff),-7,7):clamp(diff,-7,7);const row=SIT[cd+7];
  /* Domination : un écart d'Habileté de +8 ou plus gagne le combat d'office, −8 ou moins le perd (sauf règle spéciale). */
  const dom=(c.noDom||forced||c.free)?null:diff>=8?'win':diff<=-8?'lose':null;
  const cost=row[2];
  return {b,e,diff,cd,dom,forced,name:dom==='win'?'Domination':dom==='lose'?'Dominé':row[1],cost,table:row[3]};
}
/* L'adversaire esquive sur certaines faces du dé d'attaque (aucun dégât, même critique). */
function enemyDodges(c,atk){
  const e=c.eDodge;if(!e)return false;
  if(e.fromHalf&&!(int(c.enemy.pv)*2<int(c.enemy.pvMax)))return false;
  if(e.unless&&e.unless.some(id=>S.billy.items.includes(id)))return false;
  return e.faces?e.faces.includes(atk):e.parity==='even'?atk%2===0:atk%2===1;
}
function resolveTurn(atk,dodge){
  const c=S.combat;const s=situation();
  const pair=s.table[atk-1];
  const canDodge=s.b.adr>=2;
  const dodged=canDodge&&dodge!=null&&dodge<=s.b.adr;
  const crit=dodged&&dodge===1&&!c.noCrit;
  let dealt=crit?s.table[5][0]+s.b.crit:Math.max(0,pair[0]+s.b.deg-int(s.e.arm));
  const eDodged=enemyDodges(c,atk);if(eDodged)dealt=0;
  if(c.oddHalfDealt&&atk%2===1)dealt=Math.floor(dealt/2);
  if(c.dealtWin&&(dealt<c.dealtWin[0]||dealt>c.dealtWin[1]))dealt=0;
  if(c.dealtCap!=null)dealt=Math.min(dealt,c.dealtCap);
  let taken;
  if(dodged||(c.oddNoTaken&&atk%2===1))taken=0;
  else if(c.fixedTaken!=null)taken=c.fixedTaken;
  else{
    let base=pair[1];
    if(c.eBonusFace&&c.eBonusFace.face===atk)base+=c.eBonusFace.dmg;
    if(c.eDoubleBelow!=null&&int(s.e.pv)<=c.eDoubleBelow)base*=2;
    taken=Math.max(0,base+int(s.e.deg)-s.b.arm);
    if(s.b.cls==='paysan'&&!c.noReduce)taken=Math.min(3,taken);
    if(c.halfTaken)taken=CFG().titanRound==='floor'?Math.floor(taken/2):Math.ceil(taken/2);
  }
  return {dealt,taken,dodged,crit,canDodge,eDodged};
}
/* Un adversaire achevé pendant l'assaut ne frappe pas : Billy ne subit rien.
   Exception réglable pour les combats où le livre fait encaisser Billy en premier. */
function finishTurn(r,before,n){
  const c=S.combat;
  r.killFirst=false;r.quiet=false;
  if(r.taken>0&&((c.quiet&&n<=c.quiet)||(c.noReplyTurn&&n===c.noReplyTurn))){r.taken=0;r.quiet=true;}
  /* L'adversaire achevé frappe quand même, sauf si son coup tuerait aussi Billy : Billy l'achève avant sa riposte. */
  const bell=(evolved()&&stats().cls==='guerrier')||S.billy.items.some(id=>(byId(id)||{}).finisher);
  if(before.epv>0&&r.dealt>=before.epv&&r.taken>0&&(bell||(!c.billyFirst&&r.taken>=before.bpv))){r.killFirst=true;r.taken=0;}
  return r;
}
function applyTurn(r,before){
  S.combat.enemy.pv=Math.max(0,before.epv-r.dealt);
  S.billy.pv=Math.max(0,before.bpv-r.taken);
}
/* Effets automatiques des combats du livre, appliqués à la fin de chaque assaut. */
function tickSet(k,v,cap){
  const c=S.combat,b=S.billy;
  if(k==='b.pv'){b.pv=Math.max(0,b.pv+v);return;}
  if(k==='b.chance'){b.chance=Math.max(0,b.chance+v);return;}
  const s=k.slice(2);
  if(k.startsWith('f.')){c[s]=v;return;}
  const obj=k.startsWith('e.')?c.enemy:c.mods;
  let x=int(obj[s])+v;
  if(cap!=null)x=v>0?Math.min(x,cap):Math.max(x,cap);
  if(k==='e.pv')x=Math.max(0,x);
  obj[s]=x;
}
function runEffects(t){
  const c=S.combat;const notes=[];const n=t.n;const cls=stats().cls;
  const alive=()=>c.enemy.pv>0&&S.billy.pv>0;
  c.lossDone=c.lossDone||{};
  (c.perLoss||[]).forEach((pl,i)=>{
    const due=Math.floor((int(c.enemy.pvMax)-int(c.enemy.pv))/pl.every);const done=int(c.lossDone[i]);
    if(due>done){for(let j=done;j<due;j++)tickSet(pl.k,pl.v,pl.cap);c.lossDone[i]=due;if(pl.label)notes.push(pl.label);}
  });
  c.belowDone=c.belowDone||{};
  (c.below||[]).forEach((bw,i)=>{
    if(!c.belowDone[i]&&int(c.enemy.pv)<=bw.pv){bw.fx.forEach(f=>tickSet(f.k,f.v));c.belowDone[i]=1;if(bw.label)notes.push(bw.label);}
  });
  for(const tk of (c.ticks||[])){
    if(!alive())break;
    if(tk.at!=null?n!==tk.at:n%(tk.every||1)!==0)continue;
    if(tk.ifTaken&&!(t.taken>0))continue;
    if(tk.ifHit&&t.dodged)continue;
    const v=tk.cls&&tk.cls[cls]!=null?tk.cls[cls]:tk.v;
    if(tk.k==='b.pv'&&tk.dodge){const a=effB().adr;if(a>=2){const dd=d6();if(dd<=a){notes.push(`${tk.label} esquivé (${dd})`);continue;}}}
    tickSet(tk.k,v,tk.cap);
    if(tk.label)notes.push(tk.k==='b.pv'?`${tk.label} : ${-v} PV perdu${-v>1?'s':''}`:tk.label);
  }
  if(c.instantWin&&n===1)c.forced='victoire';
  if(c.limit&&n>=c.limit.turns&&alive()&&!c.forced){c.forced=c.limit.result;if(c.limit.label)notes.push(c.limit.label);}
  t.notes=notes;
}
/* Rejoue un assaut depuis l'état d'avant (assaut normal ou relance du Débrouillard). */
function performTurn(t){
  const c=S.combat;
  combatRestore(c,t.before.state);S.billy.pv=t.before.bpv;S.billy.chance=t.before.chance;
  if(t.elusifCost)S.billy.chance=Math.max(0,S.billy.chance-t.elusifCost);
  if(c.rollHab){if(!t.habRoll)t.habRoll=d6();c.enemy.hab=c.rollHab.base+c.rollHab.mult*t.habRoll-(CFG().bagarre==='fixe'?(t.n>1?c.rollHab.decay:0):c.rollHab.decay*(t.n-1));t.eHab=c.enemy.hab;}
  const r0=resolveTurn(t.atk,t.dodge);
  if(t.dblRoll!=null){const ch=t.before.chance;t.dblOk=t.dblRoll<=ch;S.billy.chance=Math.max(0,ch-1);r0.dealt=t.dblOk?r0.dealt*2:0;}
  const r=finishTurn(r0,t.before,t.n);
  applyTurn(r,t.before);Object.assign(t,r);
  runEffects(t);
}
/* Combat sans la table : un dé par tour, parité suivie, 1 PV perdu à partir du 2e tour sauf esquive. */
function performParity(t){
  const c=S.combat;
  combatRestore(c,t.before.state);S.billy.pv=t.before.bpv;S.billy.chance=t.before.chance;
  Object.assign(t,{dealt:0,taken:0,dodged:false,crit:false,killFirst:false,quiet:false});
  if(t.n>=2){const a=effB().adr;if(a>=2&&t.dodge!=null&&t.dodge<=a)t.dodged=true;else{t.taken=1;S.billy.pv=Math.max(0,S.billy.pv-1);}}
  const last3=c.turns.slice(-3).map(x=>x.atk%2);
  t.notes=[`dé ${t.atk%2?'impair':'pair'}`];
  if(last3.length===3&&last3.every(x=>x===last3[0])){c.forced='fin';t.notes.push(`trois ${last3[0]?'impairs':'pairs'} d’affilée`);}
}

const lastTurn=()=>S.combat&&S.combat.turns.length?S.combat.turns[S.combat.turns.length-1]:null;
function turnText(t){
  let s=`Assaut ${t.n} : `;
  if(S.combat&&S.combat.free){s+=`${(t.notes||[]).join(', ')}${t.taken?', 1 PV perdu':t.dodged?', esquivé':''}.`;return s;}
  if(t.eHab!=null)s+=`Habileté adverse ${t.eHab}. `;
  if(t.crit)s+=`esquive et contre-attaque critique, ${t.dealt} infligés.`;
  else if(t.dodged)s+=`esquive, aucun dégât subi, ${t.dealt} infligés.`;
  else if(t.killFirst)s+=`${t.dealt} infligés : l’adversaire tombe avant sa riposte mortelle, aucun dégât subi.`;
  else if(t.quiet)s+=`${t.dealt} infligés : l’adversaire n’attaque pas, aucun dégât subi.`;
  else if(t.eDodged)s+=`l’adversaire esquive, ${t.taken} subis.`;
  else s+=`${t.dealt} infligés, ${t.taken} subis.`;
  if(t.notes&&t.notes.length)s+=' '+t.notes.join('. ')+'.';
  if(t.rerolled)s+=t.reroll2?` Relances ${t.atk0} → ${t.atk1} → ${t.atk} (−${t.elusifCost} Chance).`:` Relance ${t.atk0} → ${t.atk}.`;
  if(t.dblRoll!=null)s+=t.dblOk?' Dégâts doublés par la Chance.':' Test de Chance raté pour doubler.';
  if(t.survive)s+=t.survive.ok?' Sauvé par la Chance.':' Test de survie raté.';
  return s;

let actx=null;
function diceSound(ms){
  if(!CFG().sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;const n=8;
    for(let i=0;i<n;i++){
      const t=t0+(ms/1000)*Math.pow(i/(n-1),0.75);const len=0.035;
      const buf=actx.createBuffer(1,Math.floor(actx.sampleRate*len),actx.sampleRate);const dd=buf.getChannelData(0);
      for(let j=0;j<dd.length;j++)dd[j]=(Math.random()*2-1)*Math.pow(1-j/dd.length,3);
      const src=actx.createBufferSource();src.buffer=buf;
      const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1500+Math.random()*1500;f.Q.value=1.1;
      const g=actx.createGain();g.gain.value=i===n-1?0.35:0.06+0.12*(1-i/n);
      src.connect(f);f.connect(g);g.connect(actx.destination);src.start(t);
    }
  }catch(e){}
}

/* Fait rouler un dé en 3D dans n'importe quel conteneur ; se résout quand il se pose. */
function rollCube(el,fin,dur){
  return new Promise(res=>{
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce||typeof Element.prototype.animate!=='function'){el.innerHTML=dieSVG(fin);res();return;}
    const rot=CUBE_ROT[fin]||[0,0];
    el.innerHTML=`<span class="cube-scene"><span class="die-shadow"></span><span class="hop"><span class="cube">${[1,2,3,4,5,6].map(n=>`<span class="face f${n}">${dieSVG(n)}</span>`).join('')}</span></span></span>`;
    const scene=el.querySelector('.cube-scene'),cube=el.querySelector('.cube'),hop=el.querySelector('.hop'),sh=el.querySelector('.die-shadow');
    const s=scene.getBoundingClientRect().width||100;const z=`translateZ(${(-s*.45).toFixed(1)}px)`;

const ENDING_KIND={victoire:'Victoire finale',fin:'Fin de l’aventure',mort:'Billy a péri'};
function archiveCombat(c){
  if(!c||!S)return;const j=S.journal=S.journal||{};
  for(const k of ['combats','won','lost','evaded','assaults','dealt','taken'])j[k]=int(j[k]);
  j.combats++;j.assaults+=c.turns.length;
  for(const t of c.turns){j.dealt+=int(t.dealt);j.taken+=int(t.taken);}
  if(c.status==='victoire'||(c.status==='domination'&&c.domResult==='win'))j.won++;
  else if(c.status==='evite')j.evaded++;
  else if(c.status==='defaite'||(c.status==='domination'&&c.domResult==='lose'))j.lost++;
}
function endCombat(){if(S&&S.combat){archiveCombat(S.combat);S.combat=null;}}
function journalNow(){
  const j=Object.assign({combats:0,won:0,lost:0,evaded:0,assaults:0,dealt:0,taken:0},S.journal||{});
  if(S.combat){const tmp=S.journal;S.journal=clone(j);archiveCombat(S.combat);const r=S.journal;S.journal=tmp;return r;}
  return j;
}

/* ---------- Champs modifiables ---------- */
function field(k){
  const b=S.billy,c=S.combat;
  if(k==='pv')return {label:'Points de vie',get:()=>b.pv,set:v=>{b.pv=v;},min:0,max:()=>stats().t.pvmax};
  if(k==='chance')return {label:'Chance',get:()=>b.chance,set:v=>{b.chance=v;},min:0,max:()=>stats().t.cha};
  if(k.startsWith('c.')){const s=k.slice(2);const cd=prof().counters.find(x=>x.k===s);return {label:cd?cd.l:s,get:()=>int(b.counters[s]),set:v=>{b.counters[s]=v;},min:0,max:()=>999};}
  if(k.startsWith('adj.')){const s=k.slice(4);return {label:LABEL[s]+', ajustement',signed:true,get:()=>int(b.adj[s]),set:v=>{b.adj[s]=v;},min:-30,max:()=>30};}
  if(k.startsWith('m.')&&c){const s=k.slice(2);return {label:({hab:'Bonus d’Habileté',adr:'Bonus d’Adresse',arm:'Bonus d’Armure',deg:'Bonus de Dégâts',crit:'Bonus de Critique'}[s]||'Bonus')+' pour ce combat',signed:true,get:()=>int(c.mods[s]),set:v=>{c.mods[s]=v;},min:-30,max:()=>30};}
  if(k.startsWith('e.')&&c){
    const s=k.slice(2);
    const lab={hab:'Habileté de l’adversaire',pv:'PV de l’adversaire',arm:'Armure de l’adversaire',deg:'Dégâts de l’adversaire'}[s];
    return {label:lab,signed:s==='deg',get:()=>int(c.enemy[s]),set:v=>{c.enemy[s]=v;if(s==='pv'&&v>c.enemy.pvMax)c.enemy.pvMax=v;},min:s==='deg'?-10:0,max:()=>999};
  }
  return null;
}
function bump(k,d){if(d<0&&k.startsWith('c.')&&(prof().counters.find(x=>'c.'+x.k===k)||{}).noDec)return;const f=field(k);if(!f)return;const was=S&&S.billy?S.billy.pv:0;f.set(clamp(f.get()+d,f.min,f.max()));commit();if(k==='pv'&&was>0&&S.billy.pv===0)showDeath();}

function viewSac(){
  const b=S.billy;
  let h=`<section class="sheet"><h2>Objets de départ</h2>`;
  const inact=stats().inactive;
  h+=b.items.map(id=>{
    const it=byId(id);if(!it)return '';
    let sub={arme:'Arme',equipement:'Équipement',outil:'Outil'}[it.cat]+(it.hands===2?', à deux mains':(it.cat!=='arme'&&it.hands?', tenu à la main':''));
    if(inact.has(id))sub+='. Plus de main libre : '+((it.keep||[]).length?'seul le bonus de '+it.keep.map(k=>LABEL[k]).join(', ')+' compte.':'ses bonus ne comptent pas.');
    else if(it.note)sub+='. '+it.note+'.';
    const st0=stats();const conflict=!b.cumul&&st0.hands.need>2&&st0.hands.handItems.includes(id);
    const hold=(conflict?`<button class="btn hold-btn" data-a="holdItem" data-id="${id}" aria-pressed="${!inact.has(id)}">${inact.has(id)?'Prendre en main':'En main'}</button>`:'')+(it.two?`<button class="btn hold-btn" data-a="twoHand" aria-pressed="${!!b.twoHand}">${b.twoHand?'À deux mains':'À une main'}</button>`:'');
    return `<div class="start-row"><div><b>${it.name}</b><div class="small muted">${sub}</div></div><div class="start-side">${badges(it.mods)}${hold}</div></div>`;
  }).join('');
  if(!b.cumul&&stats().hands.need>2)h+=`<p class="small muted">Billy n’a que deux mains : touchez « Prendre en main » pour choisir ce qu’il tient.</p>`;
  if(inact.size||b.cumul)h+=`<div class="start-row"><div><b>Cumul autorisé</b><div class="small muted">À activer seulement si le livre vous permet de tenir un objet de plus en main.</div></div><button class="btn" data-a="toggleCumul" aria-pressed="${!!b.cumul}">${b.cumul?'Oui':'Non'}</button></div>`;
  h+=`</section><section class="sheet"><h2>Sac</h2>
    <div class="go"><input id="itemIn" autocomplete="off" enterkeyhint="done" placeholder="Nom de l’objet" aria-label="Nouvel objet" data-enter="addItem"><button class="btn primary" data-a="addItem">Ajouter</button></div>`;
  if(!S.inventory.length){
    h+=`<p class="muted small" style="margin-top:10px">Le sac est vide. Ajoutez les objets au fil des paragraphes ; touchez un objet pour noter son usage ou un bonus permanent.</p>`;
  }else{
    const extra=it=>{
      if(Object.keys(it.mods||{}).some(k=>int(it.mods[k])))return '';
      const e=catMatch(it.name);if(!e)return '';
      if(e.m&&Object.keys(e.m).length)return `<button class="btn item-x" data-a="applyCat" data-id="${it.id}">Bonus du livre ${badges(e.m)}</button>`;
      const v=installedOf(e);
      if(v&&v.m)return `<button class="btn item-x" data-a="installItem" data-id="${it.id}">Installer ${badges(v.m)}</button>`;
      return '';
    };
    h+=`<ul class="items">`+S.inventory.map(it=>`<li><button class="item" data-a="itemEdit" data-id="${it.id}"><span class="n">${esc(it.name)}</span>${it.note?`<span class="note">${esc(it.note)}</span>`:''}${badges(it.mods)}</button>${extra(it)}</li>`).join('')+`</ul>`;
  }
  return h+`</section>`;
}

const bookCombat=()=>S&&BOOK_COMBATS[S.tome]?BOOK_COMBATS[S.tome][String(S.para)]||null:null;
function bookCard(){
  const bc=bookCombat();if(!bc)return '';
  const c=S.combat;const same=c&&c.src&&c.src.tome===S.tome&&c.src.para===S.para;
  const busy=c&&c.status==='en cours'&&!same;
  const py=bc.np?0:bc.py;
  const chip=(k,l,v)=>`<span class="badge" style="${cvar(k)}">${ico(k)}${l} ${v}</span>`;
  return `<section class="sheet book-card"><h2>Combat au § ${S.para}</h2>
    <p class="book-name">${esc(bc.n)}</p>
    <div class="badges">${chip('hab','Hab.',bc.h+int(bc.eh))}${chip('pv','PV',bc.pv)}${chip('arm','Arm.',bc.a)}${chip('deg','Dég.',fmt(bc.d))}${py?`<span class="badge">Pyro-Barbare +${py}</span>`:''}</div>
    ${bc.r?`<p class="small" style="margin-top:8px">${esc(bc.r)}</p>`:''}
    <div class="btn-row">${same?`<button class="btn primary" data-a="tab" data-t="combat">${emb(stats().cls)}Reprendre le combat</button>`:`<button class="btn primary" data-a="engageBook">${emb(stats().cls)}${busy?'Engager (remplace le combat en cours)':'Engager ce combat'}</button>`}</div>
  </section>`;
}
function startBookCombat(){
  endCombat();
  const bc=bookCombat();if(!bc)return;
  const sts=stats();const st=sts.t;const x=bc.x||[];const fx=bc.fx||{};
  const items=S.billy.items;const has=id=>items.includes(id);
  const m={hab:(bc.np?0:bc.py)+int(bc.mh),adr:int(bc.ma),arm:0,deg:0,crit:0};
  if(x.includes('armZero'))m.arm=-st.arm;
  if(x.includes('critZero'))m.crit=-st.crit;
  if(x.includes('degZero'))m.deg=-st.deg;
  if(x.includes('degNeg'))m.deg=-2*st.deg;
  if(x.includes('addStats'))m.hab+=st.cha+st.end+st.adr;
  /* Objets de départ : bonus ou malus propres à ce combat, objet inutilisable, combat à mains nues. */
  for(const g of fx.w||[])if(g.items.some(has))for(const k in g.m)m[k]+=g.m[k];
  const counted=id=>{const it=byId(id);return sts.inactive.has(id)?(it.keep||[]):Object.keys(it.mods);};
  for(const id of fx.unequip||[])if(has(id))for(const k of counted(id))if(k in m)m[k]-=byId(id).mods[k];
  if(fx.bare)for(const id of items){const it=byId(id);if(!it||!(it.cat==='arme'||it.hands))continue;for(const k of ['hab','deg','crit'])if(counted(id).includes(k)&&it.mods[k])m[k]-=it.mods[k];}
  if(fx.natHab)m.hab-=sts.part.depart.hab+sts.part.sac.hab;
  if(fx.titan){const r=int(S.billy.counters&&S.billy.counters.rancune);m.deg+=st.adr+st.crit+st.arm+r;m.adr-=st.adr;m.crit-=st.crit;m.arm-=st.arm;}
  const ticks=clone(fx.ticks||[]);
  for(const k of fx.revert1||[])if(m[k])ticks.push({k:'m.'+k,v:-m[k],at:1});
  S.combat={enemy:{name:bc.n,hab:bc.h+int(bc.eh),pv:bc.pv,pvMax:bc.pv,arm:bc.a,deg:bc.d+int(fx.ed)},mods:m,habDiv:bc.div||null,billyFirst:!!bc.bf,noDom:!!bc.nd,
    note:bc.r||'',turns:[],status:'en cours',evCost:0,src:{tome:S.tome,para:S.para},ticks};
  for(const k of ['eDodge','eBonusFace','habMin','noCrit','noReduce','forceDiff','fixedTaken','halfTaken','dealtCap','dealtWin','oddHalfDealt','oddNoTaken','eDoubleBelow','quiet','noReplyTurn','noChance','noReroll','winAt','limit','perLoss','below','rollHab','noDeath','free','instantWin'])
    if(fx[k]!==undefined)S.combat[k]=clone(fx[k]);
  if(S.combat.free)S.combat.noDom=true;
  setTab('combat');commit();window.scrollTo(0,0);
  if(fx.limitAsk)openDlg({kind:'choice',title:'Délai du combat',text:'L’effet de surprise a-t-il été obtenu ?',options:[{label:'Oui : 8 tours',n:8},{label:'Non : 5 tours',n:5}]});
}
function rulesBlock(){
  return `<section class="sheet"><details class="rules"><summary>Rappel des règles appliquées</summary><ul>
    <li>Chaque assaut, un dé d’attaque est lu dans la table selon l’écart d’Habileté (plafonné entre −7 et +7).</li>
    <li>Infligés : valeur de la table + Dégâts de Billy − Armure adverse. Subis : valeur de la table + Dégâts adverses − Armure de Billy.</li>
    <li>Domination : avec un écart d’Habileté de +8 ou plus, Billy remporte le combat d’office ; à −8 ou moins, il le perd. Certains combats l’interdisent (réglage « Pas de domination »).</li>
    <li>Si Billy achève l’adversaire, celui-ci frappe quand même ; si ce dernier coup devait tuer Billy, il est annulé : Billy l’achève avant sa riposte. Pour un combat où le livre fait encaisser Billy en premier, le bouton d’ordre passe en règle spéciale.</li>
    <li>Avec 2 d’Adresse ou plus, un second dé est lancé : s’il est inférieur ou égal à l’Adresse, Billy ne subit rien. Sur un 1, contre-attaque critique : la valeur de la face 6 + Critique, sans tenir compte de l’Armure.</li>
    <li>Guerrier : +1 Dégâts, déjà compté, sauf en contre-attaque critique. Paysan : 3 dégâts au plus par attaque, après Dégâts et Armure. Débrouillard : une relance du dé d’attaque par tour, définitive. Prudent : éviter le combat (test de Chance ; réussi, coût de la situation ; raté, 1 point), survivre à un coup mortel (coût 1, puis 2, puis 3…), doubler les dégâts d’un assaut (1 point ; raté, aucun dégât).</li>
    <li>Règle spéciale d’un combat : recopiez-la dans « Règle de ce combat », puis appliquez-la avec les − et + (bonus du Pyro-Barbare, malus d’encerclement, −1 Habileté par tour…) et l’option Habileté ÷ 2, qui divise l’Habileté de la fiche avant les bonus du combat. Le numéro de tour sert de repère pour les règles du type « tous les 3 tours ».</li>
    <li>« Annuler l’assaut » remet les PV et toutes les valeurs des deux camps dans l’état d’avant cet assaut.</li>
  </ul></details></section>`;
}

  const qs=(key,lab,val,mod,aria)=>`<div class="qs ${mod?'mod':''}" style="${cvar(key.split('.').pop())}"><button class="qs-b" data-a="bump" data-k="${key}" data-d="-1" aria-label="${aria} moins un">−</button><button class="qs-v" data-a="edit" data-k="${key}"><span>${ico(key.split('.').pop())}${lab}</span><b>${val}</b></button><button class="qs-b" data-a="bump" data-k="${key}" data-d="1" aria-label="${aria} plus un">+</button></div>`;

  }
  let prev=`<div class="rh">Face</div>`;
  for(let f=1;f<=6;f++)prev+=`<div class="fh ${last&&last.atk===f?'hit':''}">${f}</div>`;
  prev+=`<div class="rh">Infligés</div>`;
  const rs=[1,2,3,4,5,6].map(f=>resolveTurn(f,null));
  rs.forEach((r,i)=>{prev+=`<div class="dealt ${last&&last.atk===i+1?'hit':''}">${r.dealt}</div>`;});
  prev+=`<div class="rh">Subis</div>`;
  rs.forEach((r,i)=>{prev+=`<div class="taken ${last&&last.atk===i+1?'hit':''}">${r.taken}</div>`;});
  if(!c.free)h+=`<section class="sheet"><h2>Table des situations</h2>
    <div class="sit"><span class="sit-name">${s.name}</span><span class="muted">Écart ${fmt(s.diff)}${Math.abs(s.diff)>7?` (lu à ${fmt(s.cd)})`:''}</span></div>

    <div class="btn-row"><button class="btn" data-a="reportOpen">Signaler un problème sur ce combat</button></div>
  </section>`;
  return h+rulesBlock();
}

function lastHTML(t){
  let lead='';
  if(t.crit)lead='<b class="crit-txt">Contre-attaque critique !</b> ';
  else if(t.dodged)lead='Esquive réussie. ';
  else if(t.killFirst)lead='Achevé avant sa riposte. ';
  else if(t.quiet)lead='L’adversaire n’attaque pas. ';
  if(t.eDodged)lead='L’adversaire esquive. '+lead;
  if(t.dblRoll!=null)lead+=t.dblOk?'Dégâts doublés ! ':'Doublement raté. ';
  if(t.eHab!=null)lead=`Hab. adverse ${t.eHab}. `+lead;
  if(S.combat&&S.combat.free)return `<span class="last-n">Assaut ${t.n}</span> ${esc((t.notes||[]).join(', '))}${t.taken?' <span class="n-taken">1 PV perdu</span>':t.dodged?' esquivé':''}`;
  let s=`<span class="last-n">Assaut ${t.n}</span> ${lead}<span class="n-dealt">${t.dealt} infligé${t.dealt>1?'s':''}</span> <span class="n-taken">${t.taken} subi${t.taken>1?'s':''}</span>`;
  if(t.rerolled)s+=t.reroll2?` <span class="muted">(relances ${t.atk0} → ${t.atk1} → ${t.atk})</span>`:` <span class="muted">(relance ${t.atk0} → ${t.atk})</span>`;
  if(t.survive)s+=t.survive.ok?' Sauvé par la Chance.':' Test de survie raté.';
  if(t.notes&&t.notes.length)s+=` <span class="muted">${esc(t.notes.join('. '))}.</span>`;
  return s;
}

/* ---------- Exporter / importer les parties ----------
   Une copie de toutes les parties dans un fichier ou un texte : pour changer de téléphone,
   passer de la version en ligne à l'application Android, ou se protéger d'une désinstallation. */
const bridge=n=>window.BillyAndroid&&typeof window.BillyAndroid[n]==='function';
const exportText=()=>JSON.stringify({app:'carnet-de-billy',exportedAt:Date.now(),v:2,active:R.active,parties:R.parties,customTomes:R.customTomes||[]});
function importText(text,opts){
  const quiet=!!(opts&&opts.quiet);
  let o;try{o=JSON.parse(String(text||'').trim());}catch(e){openDlg({kind:'info',title:'Import impossible',text:'Ce texte n’est pas une sauvegarde du Carnet de Billy.'});return;}
  const mergedT=(R.customTomes||[]).slice();
  if(o&&Array.isArray(o.customTomes))o.customTomes.forEach(t=>{if(!mergedT.some(x=>x.id===t.id))mergedT.push(t);});
  if(o&&typeof o==='object')o.customTomes=mergedT;
  const inc=migrateRoot(o);R.customTomes=mergedT;
  if(!inc.parties.length){if(!quiet)openDlg({kind:'info',title:'Import impossible',text:'Aucune partie trouvée dans cette sauvegarde.'});return;}
  let added=0,updated=0,kept=0;
  for(const p of inc.parties){
    const i=R.parties.findIndex(x=>x.id===p.id);
    if(i<0){R.parties.push(p);added++;}
    else if(int(p.savedAt)>int(R.parties[i].savedAt)){R.parties[i]=p;updated++;}
    else kept++;
  }
  if(quiet&&!added&&!updated){showBackup();return;}
  if(!S)setActive(inc.active&&R.parties.some(x=>x.id===inc.active)?inc.active:R.parties[0].id);
  else S=R.parties.find(x=>x.id===R.active)||S;
  ui.view='parties';commit();window.scrollTo(0,0);
  const parts=[];
  if(added)parts.push(`${added} partie${added>1?'s':''} ajoutée${added>1?'s':''}`);
  if(updated)parts.push(`${updated} mise${updated>1?'s':''} à jour`);
  if(kept)parts.push(`${kept} déjà à jour ici, conservée${kept>1?'s':''} telle${kept>1?'s':''} quelle${kept>1?'s':''}`);
  openDlg({kind:'info',title:'Import terminé',text:parts.join(', ')+'.'});
}
window.billyImport=importText;

function backupInfo(){try{return JSON.parse(BillyAndroid.backupInfo())||{};}catch(e){return {};}}
function backupText(){
  const b=backupInfo();
  if(!b.on)return 'Désactivée. Choisissez un dossier du téléphone : chaque modification y sera recopiée automatiquement, et ce dossier survit à une désinstallation.';
  let t=`Activée dans le dossier « ${b.folder||'choisi'} ».`;
  if(b.err)t+=' Dernière copie impossible : choisissez à nouveau le dossier.';
  else if(b.last)t+=` Dernière copie : ${dateStr(b.last)}.`;
  return t;
}
function backupBlock(){

function render(){
  const app=document.getElementById('app');const nav=document.getElementById('tabs');
  /* Classe de Billy sur la racine : accent et filigrane propres à la classe. */
  const root=document.documentElement;
  if(S&&S.billy&&ui.view!=='parties')root.setAttribute('data-cls',stats().cls);else root.removeAttribute('data-cls');
  renderTop();
  if(ui.view==='tome'&&ui.tomeDraft){
    nav.hidden=true;app.classList.add('creating');app.classList.remove('has-actionbar');app.innerHTML=viewTome();
  }else if(!S||ui.view==='parties'){
    nav.hidden=true;app.classList.add('creating');app.classList.remove('has-actionbar');app.innerHTML=updBanner()+viewParties();
  }else if(!S.billy){
    nav.hidden=true;app.classList.add('creating');app.classList.remove('has-actionbar');app.innerHTML=viewCreate();
  }else{
    nav.hidden=false;app.classList.remove('creating');
    app.style.zoom=CFG().zoom&&CFG().zoom!==1?CFG().zoom:'';
    const views={billy:viewBilly,sac:viewSac,combat:viewCombat,des:viewDes,carnet:viewCarnet};
    if(!views[ui.tab])ui.tab='billy';
    nav.querySelectorAll('.tab').forEach(b=>{if(b.dataset.t===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    app.innerHTML=updBanner()+views[ui.tab]();
    app.classList.toggle('has-actionbar',ui.tab==='combat'&&!!S.combat);
    const ct=nav.querySelector('[data-t="combat"]');if(ct)ct.classList.toggle('live',!!(S.combat&&S.combat.status==='en cours'));
  }
  if(ui.dlg)renderDialog();
  animateDice();
}

  roll(el){const n=int(el.dataset.n);const dice=[];for(let i=0;i<n;i++)dice.push(d6());pushRoll({label:n===1?'1 dé':n+' dés',dice,ok:null,detail:n>1?'total '+dice.reduce((a,b)=>a+b,0):''});ui.anim=true;commit();},

  startCombat(){
    endCombat();
    const g=id=>document.getElementById(id);

    g('cHab').removeAttribute('aria-invalid');g('cPv').removeAttribute('aria-invalid');

    }
    ui.cErr='';
    S.combat={enemy:{name:g('cName').value.trim()||'Adversaire',hab:int(hab),pv:int(pv),pvMax:int(pv),arm:Math.max(0,int(g('cArm').value)),deg:Math.max(0,int(g('cDeg').value))},
      mods:{hab:0,adr:0,arm:0,deg:0,crit:0},habDiv:null,billyFirst:false,noDom:false,note:g('cRule')?g('cRule').value.trim():'',turns:[],status:'en cours',evCost:0};
    commit();window.scrollTo(0,0);
  },
  assault(){
    const c=S.combat;if(!c||c.status!=='en cours')return;
    const n=c.turns.length+1;const s=situation();
    const t={n,atk:d6(),dodge:null,rerolled:false,atk0:null,survive:null};
    if(s.b.adr>=2&&!(c.free&&n<2))t.dodge=d6();
    t.before={bpv:S.billy.pv,chance:S.billy.chance,epv:c.enemy.pv,state:combatSnap(c)};
    c.turns.push(t);
    ui.rollFrom={bpv:t.before.bpv,epv:t.before.epv,chance:t.before.chance};
    if(c.free)performParity(t);else performTurn(t);
    ui.anim=true;commit();
  },
  reroll(){
    const c=S.combat;const t=lastTurn();
    if(!c||!t||t.rerolled||t.survive||t.pdodge||c.free||!t.before.state||stats().cls!=='debrouillard'||noRerollNow(c,t.n))return;
    ui.rollFrom={bpv:S.billy.pv,epv:c.enemy.pv,chance:S.billy.chance};
    t.atk0=t.atk;t.atk=d6();t.rerolled=true;

  undo(){
    const c=S.combat;if(!c)return;
    if(c.status==='evite'){S.billy.chance+=c.evCost;c.evCost=0;c.status='en cours';commit();return;}
    if(c.status==='domination'){c.status='en cours';c.domResult=null;commit();return;}
    const t=c.turns.pop();if(!t)return;
    if(t.before.state){combatRestore(c,t.before.state);S.billy.pv=t.before.bpv;S.billy.chance=t.before.chance;c.status='en cours';commit();return;}
    S.billy.pv=t.before.bpv;c.enemy.pv=t.before.epv;
    if(t.before.enemy)Object.assign(c.enemy,t.before.enemy);
    if(t.before.mods)c.mods=clone(t.before.mods);
    if('habDiv' in t.before)c.habDiv=t.before.habDiv;
    if('billyFirst' in t.before)c.billyFirst=t.before.billyFirst;
    if(t.survive)S.billy.chance=t.survive.chanceBefore;
    c.status='en cours';commit();
  },
  survive(){
    /* Coup mortel : test de Chance dont le coût vaut 1, puis 2, 3… à chaque survie réussie dans ce combat. Réussi : les dégâts du coup sont annulés. */
    const c=S.combat;const t=lastTurn();if(!c||!t||t.survive||S.billy.pv>0||stats().cls!=='prudent'||!(t.taken>0))return;
    const cost=int(c.survivals)+1;const before=S.billy.chance;if(before<cost)return;
    const n=d6();const ok=n<=before;
    S.billy.chance=before-cost;
    if(ok){S.billy.pv=t.before.bpv;c.survivals=int(c.survivals)+1;}
    t.survive={ok,roll:n,chanceBefore:before,cost};
    pushRoll({label:'Test de Chance (survie)',dice:[n],ok,detail:`${n} contre ${before}`});
    commit();
    showChanceReveal({title:'Test de Chance',need:before,roll:n,ok,line:pick(ok?FATE_LINES.survieOk:FATE_LINES.survieKo),
      detail:ok?`Le coup est annulé : Billy reste à ${S.billy.pv} PV. Coût : ${cost} point${cost>1?'s':''} de Chance (${before} → ${S.billy.chance}).`:`Coût : ${cost} point${cost>1?'s':''} de Chance (${before} → ${S.billy.chance}).`,
      then:()=>{if(!ok)showDeath({fromTurn:true,note:'Test de Chance raté.'});}});
  },
  dblLast(){
    /* Doubler les dégâts de l'assaut : test de Chance (1 point) ; raté, aucun dégât infligé ce tour. */
    const c=S.combat;const t=lastTurn();
    if(!c||!t||t.dblRoll!=null||t.survive||!t.before.state||c.free||stats().cls!=='prudent'||!(t.dealt>0)||t.before.chance<1||!['en cours','defaite'].includes(c.status)||noChanceNow(c,t.n))return;
    const ch=t.before.chance;t.dblRoll=d6();
    performTurn(t);
    pushRoll({label:'Test de Chance (doubler)',dice:[t.dblRoll],ok:t.dblOk,detail:`${t.dblRoll} contre ${ch}`});
    hideDeath();commit();
    showChanceReveal({title:'Test de Chance',need:ch,roll:t.dblRoll,ok:t.dblOk,line:pick(t.dblOk?FATE_LINES.dblOk:FATE_LINES.dblKo),
      detail:t.dblOk?`Dégâts doublés : ${t.dealt} infligés. Chance : ${ch} → ${S.billy.chance}.`:`Aucun dégât infligé ce tour. Chance : ${ch} → ${S.billy.chance}.`,
      then:()=>{const cc=S.combat;if(!cc)return;if(cc.status==='defaite'&&S.billy.pv<=0)showDeath({fromTurn:true});else if(cc.status==='victoire'&&!t.cheered){t.cheered=true;persistLocal();showVictory();}}});
  },
  prudentWin(){
    /* Éviter le combat : test de Chance ; réussi, la dépense indiquée par la situation ; raté, 1 point et le combat continue. */
    const c=S.combat;if(!c||c.status!=='en cours'||stats().cls!=='prudent')return;
    const s=situation();const before=S.billy.chance;
    if(before<Math.max(1,s.cost))return;
    const n=d6();const ok=n<=before;S.billy.chance=before-(ok?s.cost:1);
    pushRoll({label:'Test de Chance (éviter le combat)',dice:[n],ok,detail:`${n} contre ${before}`});
    if(ok){c.evCost=s.cost;c.status='evite';}
    commit();
    showChanceReveal({title:'Test de Chance',need:before,roll:n,ok,line:pick(ok?FATE_LINES.eviteOk:FATE_LINES.eviteKo),
      detail:ok?`Combat évité. Chance : ${before} → ${S.billy.chance}.`:`Chance : ${before} → ${S.billy.chance}. Le combat continue.`});
  },
  closeCombat(){
    const c=S.combat;if(!c)return;
    if(c.status==='en cours'&&c.turns.length)openDlg({kind:'confirm',title:'Clore le combat ?',text:'Le combat est encore en cours. Les PV actuels de Billy sont conservés.',ok:'Clore',act:'closeCombat'});
    else CONFIRM.closeCombat();
  },
  saveCreate(){
    /* L'état est capturé tout de suite ; le nom proposé peut être changé avant d'enregistrer. */
    const t=stats().t;const details=`§ ${S.para}, ${S.billy.pv}/${t.pvmax} PV, Chance ${S.billy.chance}`;
    const snap={id:uid(),t:Date.now(),details,label:details,game:clone({billy:S.billy,inventory:S.inventory,para:S.para,history:S.history})};
    openDlg({kind:'saveName',snap,name:`Sauvegarde ${S.saves.length+1}`});
    setTimeout(()=>{const i=document.getElementById('saveNameIn');if(i){i.focus();i.select();}},50);
  },
  saveRename(el){const sv=S.saves.find(x=>x.id===el.dataset.id);if(!sv)return;openDlg({kind:'saveName',id:sv.id,name:sv.name,details:sv.details});setTimeout(()=>{const i=document.getElementById('saveNameIn');if(i){i.focus();i.select();}},50);},
  saveNameOk(){
    const v=((document.getElementById('saveNameIn')||{}).value||'').trim();const d=ui.dlg;closeDlg();if(!d)return;
    if(d.id){const sv=S.saves.find(x=>x.id===d.id);if(sv)sv.name=v||sv.name;}
    else{d.snap.name=v||d.name;S.saves.unshift(d.snap);S.saves=S.saves.slice(0,30);}
    commit();
  },
  askRestore(el){const sv=S.saves.find(x=>x.id===el.dataset.id);if(!sv)return;openDlg({kind:'confirm',title:'Restaurer ?',text:`Billy, le sac et le paragraphe reviennent à « ${esc(sv.name)} » (${esc(sv.details||'')}). Les notes restent telles quelles.`,ok:'Restaurer',act:'restore',arg:sv.id});},
  saveDelete(el){const sv=S.saves.find(x=>x.id===el.dataset.id);if(!sv)return;openDlg({kind:'confirm',title:'Supprimer la sauvegarde ?',text:`« ${esc(sv.name)} » sera effacée.`,ok:'Supprimer',act:'delSave',arg:sv.id});},
  exportOpen(){openDlg({kind:'export'});},
  updGet(){if(ui.update)openExternal(ui.update.url);},
  updHide(){if(ui.update){R.cfg.updDismiss=ui.update.v;commit();}},
  updCheck(){closeDlg();checkUpdate(true);},
  reportOpen(){openDlg({kind:'report'});},
  reportCopy(){const t=(document.getElementById('reportTxt')||{}).value||buildReport();if(copyText(t)){ui.dlg.copied=true;renderDialog();}},
  reportGit(){const t=(document.getElementById('reportTxt')||{}).value;const body=`${t||buildReport()}`;openExternal(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent(S&&S.combat?`Problème en combat (§ ${S.para})`:'Problème')}&body=${encodeURIComponent(body.slice(0,6000))}`);},
  endOpen(el){hideDeath();openDlg({kind:'ending',endKind:(el&&el.dataset.v)||'fin',para:S.para});},
  endKind(el){const n=(document.getElementById('endName')||{}).value,p=(document.getElementById('endPara')||{}).value;ui.dlg.endKind=el.dataset.v;ui.dlg.name=n;ui.dlg.para=p;renderDialog();},
  endSave(){
    const d=ui.dlg;const name=(document.getElementById('endName').value||'').trim();const para=int(document.getElementById('endPara').value)||S.para;closeDlg();
    const st=stats();
    const rec={id:uid(),t:Date.now(),tome:S.tome,kind:d.endKind||'fin',name,para,cls:st.cls,clsName:evolved()?EVOL[st.cls].name:CLASSES[st.cls].name,
      counters:clone(S.billy.counters||{}),journal:journalNow(),ach:(S.achievements||[]).length,paras:new Set([...S.history,S.para]).size};
    (S.endings=S.endings||[]).push(rec);R.endings=R.endings||{};(R.endings[S.tome]=R.endings[S.tome]||[]).push({name:rec.name||ENDING_KIND[rec.kind],kind:rec.kind,para,t:rec.t});
    commit();ui.lastEnding=rec;showBilan(rec);
  },
  cardOpen(){const rec=ui.lastEnding&&ui.lastEnding.tome===S.tome?ui.lastEnding:null;hideVictory();openCard(rec);},
  cardShare(){shareCard();},
  postCopy(){const t=(document.getElementById('postTxt')||{}).value||'';ui.dlg.post=t;if(copyText(t)){ui.dlg.copied=true;renderDialog();}},
  applyCat(el){const it=S.inventory.find(x=>x.id===el.dataset.id);const e=it&&catMatch(it.name);if(!e)return;it.name=e.n;it.mods=clone(e.m||{});commit();},
  installItem(el){const it=S.inventory.find(x=>x.id===el.dataset.id);const v=it&&installedOf(catMatch(it.name));if(!v)return;it.name=v.n;it.mods=clone(v.m||{});commit();},
  toggleEvolved(){S.billy.evolved=!S.billy.evolved;commit();},
  twoHand(){S.billy.twoHand=!S.billy.twoHand;commit();},
  rerollAgain(){
    const c=S.combat;const t=lastTurn();
    if(!c||!t||!t.rerolled||t.reroll2||c.free||!t.before.state||stats().cls!=='debrouillard'||!evolved())return;
    const cost=t.atk;if(S.billy.chance<cost)return;
    t.atk1=t.atk;t.atk=d6();t.reroll2=true;t.elusifCost=cost;
    performTurn(t);ui.anim='reroll';commit();
  },
  sacrifice(){
    const b=S.billy;const st=stats();if(st.cls!=='prudent'||!evolved()||b.pv<=2||b.chance>=st.t.cha)return;
    const c=S.combat;
    if(c&&c.status==='en cours'){if(c.sacTurn===c.turns.length)return;c.sacTurn=c.turns.length;}
    else{if(b.sacPara===S.para)return;b.sacPara=S.para;}
    b.pv-=2;b.chance=Math.min(st.t.cha,b.chance+1);commit();
  },
  holdItem(el){const id=el.dataset.id;const b=S.billy;const st=stats();if(!st.inactive.has(id))return;
    const active=st.hands.handItems.filter(x=>!st.inactive.has(x));b.held=[id].concat(active);commit();},
  toggleVeteran(){S.billy.veteran=!S.billy.veteran;commit();},
  pickVeteran(){ui.veteran=!ui.veteran;render();},
  tutoNext(){if(tutoStep<TUTO.length-1){tutoStep++;renderTuto();}},
  tutoPrev(){if(tutoStep>0){tutoStep--;renderTuto();}},
  tutoClose(){closeTuto();},
  tutoOpen(){closeDlg();openTuto();},
  tomeNew(){ui.tomeDraft=blankTome();ui.view='tome';render();window.scrollTo(0,0);},
  tomeEdit(el){const t=(R.customTomes||[]).find(x=>x.id===el.dataset.id);if(!t)return;ui.tomeDraft=Object.assign(clone(t),{countersText:t.counters.map(c=>c.l).join(', ')});ui.view='tome';render();window.scrollTo(0,0);},
  tomeCancel(){ui.tomeDraft=null;ui.view='parties';render();window.scrollTo(0,0);},
  tomeSave(){
    readTomeForm();const d=ui.tomeDraft;const err=document.getElementById('tErr');
    if(!d.name){err.textContent='Indiquez le titre du livre.';return;}
    const missing=d.start.filter(it=>!it.name).length;if(missing){err.textContent=`Il manque le nom de ${missing} objet${missing>1?'s':''}.`;return;}
    const labels=(d.countersText||'').split(',').map(s=>s.trim()).filter(Boolean);
    const counters=labels.map(l=>({k:normTxt(l).replace(/[^a-z0-9]+/g,'_')||'compteur',l}));
    const tome={id:d.id||('c'+uid()),num:d.num,name:d.name,counters,start:d.start.map(it=>Object.assign({id:it.id,name:it.name,cat:it.cat,mods:it.mods},it.hands?{hands:it.hands}:{}))};
    R.customTomes=(R.customTomes||[]).filter(x=>x.id!==tome.id).concat([tome]);installCustomTomes(R.customTomes);
    ui.tomeDraft=null;ui.view='parties';commit();window.scrollTo(0,0);
  },
  tomeDel(el){const id=el.dataset.id;const used=R.parties.some(p=>p.tome===id);
    if(used){openDlg({kind:'info',title:'Tome utilisé',text:'Une partie utilise ce tome : supprimez d’abord la partie.'});return;}
    openDlg({kind:'confirm',title:'Supprimer le tome ?',text:'Sa page de création sera effacée.',ok:'Supprimer',act:'delTome',arg:id});},
  cfgOpen(){openDlg({kind:'cfg'});},
  cfgSet(el){const k=el.dataset.k;let v=el.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(!isNaN(+v))v=+v;R.cfg[k]=v;commit();},
  pnoteOpen(){openDlg({kind:'pnote',para:S.para,text:(S.paraNotes||{})[S.para]||''});setTimeout(()=>{const t=document.getElementById('pnoteIn');if(t)t.focus();},50);},
  pnoteSave(){const t=(document.getElementById('pnoteIn').value||'').trim();const p=ui.dlg.para;closeDlg();S.paraNotes=S.paraNotes||{};if(t)S.paraNotes[p]=t;else delete S.paraNotes[p];commit();},
  pnoteDel(){const p=ui.dlg.para;closeDlg();delete S.paraNotes[p];commit();},
  catToggle(el){const e=catItems()[int(el.dataset.n)];if(!e)return;const ex=inSac(e.n);if(ex)S.inventory=S.inventory.filter(x=>x!==ex);else addCatItem(e);commit();},
  catAdd(el){const e=catItems()[int(el.dataset.n)];if(!e)return;addCatItem(e);commit();const j=document.getElementById('itemIn');if(j){j.value='';j.focus();}},
  achNew(){openDlg({kind:'ach',para:S.para});setTimeout(()=>{const i=document.getElementById('achName');if(i)i.focus();},50);},
  achEdit(el){const a=(S.achievements||[]).find(x=>x.id===el.dataset.id);if(a)openDlg({kind:'ach',id:a.id,name:a.name,para:a.para,note:a.note});},
  achSave(){
    const name=(document.getElementById('achName').value||'').trim();
    if(!name){document.getElementById('achErr').textContent='Donnez un nom au succès.';return;}
    const para=int(document.getElementById('achPara').value)||null;const note=(document.getElementById('achNote').value||'').trim();
    S.achievements=S.achievements||[];
    const d=ui.dlg;closeDlg();
    if(d.id){const a=S.achievements.find(x=>x.id===d.id);if(a)Object.assign(a,{name,para,note});commit();return;}
    const e=achCat().find(x=>normTxt(x.n)===normTxt(name));
    if(e&&hasAch(e)){commit();return;}
    const a={id:uid(),cid:e?e.id:undefined,name:e?e.n:name,para:e?e.p:para,note,t:Date.now()};S.achievements.push(a);commit();celebrate(a);
  },
  achDel(){const d=ui.dlg;S.achievements=(S.achievements||[]).filter(x=>x.id!==d.id);closeDlg();commit();},
  achToast(){const el=document.getElementById('achToast');if(el){el.hidden=true;el.classList.remove('show');}},
  deathClose(){hideDeath();},
  deathGoto(){hideDeath();endCombat();goPara(prof().deathPara);setTab('billy');commit();window.scrollTo(0,0);},
  victoryStay(){hideVictory();ui.lastEnding=null;},
  victoryGo(){hideVictory();endCombat();setTab('billy');commit();window.scrollTo(0,0);},
  deathUndo(){hideDeath();A.undo();},
  deathSaves(){hideDeath();setTab('carnet');render();const s=[...document.querySelectorAll('#app h2')].find(x=>x.textContent==='Points de sauvegarde');if(s)s.scrollIntoView({block:'start'});},
  deathSurvive(){hideDeath();A.survive();},
  fateDone(){const el=document.getElementById('fate');el.hidden=true;el.innerHTML='';const f=fateThen;fateThen=null;if(f)f();},
  toggleEdit(){ui.editCombat=!ui.editCombat;render();},
  engageBook(){const c=S.combat;if(c&&c.status==='en cours'&&c.turns.length){openDlg({kind:'confirm',title:'Remplacer le combat ?',text:'Un combat est en cours. Les PV actuels de Billy sont conservés.',ok:'Engager',act:'engageBook'});return;}startBookCombat();},
  bkChoose(){try{BillyAndroid.chooseBackupFolder();}catch(e){}},
  bkStop(){try{BillyAndroid.stopBackup();}catch(e){}render();},
  importOpen(){openDlg({kind:'import'});},
  exportFile(){try{BillyAndroid.exportFile(exportText());}catch(e){}},
  importFile(){closeDlg();try{BillyAndroid.importFile();}catch(e){}},
  exportShare(){const t=exportText();if(bridge('share')){try{BillyAndroid.share(t);}catch(e){}}else if(navigator.share){navigator.share({title:'Carnet de Billy',text:t}).catch(()=>{});}},
  exportCopy(){
    const ta=document.getElementById('expText');const msg=document.getElementById('expMsg');
    const done=ok=>{if(msg)msg.textContent=ok?'Texte copié.':'Sélectionnez le texte et copiez-le à la main.';};
    const fallback=()=>{try{ta.removeAttribute('readonly');ta.focus();ta.select();const ok=document.execCommand('copy');ta.setAttribute('readonly','');done(ok);}catch(e){done(false);}};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(ta.value).then(()=>done(true),fallback);else fallback();
  },
  importPaste(){const t=document.getElementById('impText');const v=t?t.value:'';closeDlg();if(v.trim())importText(v);},
  askNewBilly(){openDlg({kind:'confirm',title:'Nouveau Billy ?',text:'Billy, le sac, le paragraphe et le combat en cours sont effacés. Les notes, les jets et les points de sauvegarde restent.',ok:'Recommencer',act:'newBilly'});}
};

document.addEventListener('click',e=>{
  if(rolling.active){e.preventDefault();rolling.finish();return;}
  const el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  const fn=A[el.dataset.a];
  if(fn){e.preventDefault();fn(el);}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target.closest('[data-enter]');
  if(el){e.preventDefault();const fn=A[el.dataset.enter];if(fn)fn(el);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='notes'){S.notes=e.target.value;saveSoon();}
  if(e.target.id==='cNote'&&S.combat){S.combat.note=e.target.value;saveSoon();}
});
/* Fermeture, rafraîchissement ou passage en arrière-plan : écrire tout de suite ce qui attend encore. */
function flushSave(){
  if(softTimer){clearTimeout(softTimer);softTimer=null;save();}
  if(remote.timer){clearTimeout(remote.timer);pushRemote();}
}
addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});

normalize();
render();
if(!CFG().tutoSeen)setTimeout(openTuto,350);
if(isApk()&&Date.now()-int(CFG().lastUpdCheck)>20*3600*1000)setTimeout(()=>checkUpdate(false),2500);
initRemote();
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
